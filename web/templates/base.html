<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NotesApp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">NotesApp</a>
    {% if g.identity %}
      <span class="who">
        {{ g.identity.username }}
        <span class="badge badge-{{ g.identity.role }}">{{ g.identity.role }}</span>
      </span>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="small">Log out all sessions</button>
      </form>
    {% endif %}
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
