<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#24779a"/></marker></defs><rect width="1500" height="1500" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17354a} .title{font-size:28px;font-weight:bold} .body{font-size:17px} .small{font-size:15px} .label{font-size:17px;font-weight:bold} .edge{stroke:#24779a;stroke-width:2;fill:none;marker-end:url(#a)} .boundary{stroke:#a65b12;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><text x="40" y="45" class="title">NotesApp system data flows and trust boundaries</text><text x="40" y="76" class="body">Canonical IDs F01–F62 refer to flows.md. Grouped arrows show request and return directions.</text><rect x="535" y="120" width="400" height="635" rx="12" fill="#f8fafc" stroke="#b8c7d0"/><text x="555" y="148" class="label">Web container</text><rect x="40" y="185" width="270" height="165" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="58" y="215" class="label">Browsers</text><text x="58" y="242" class="small">Student / Teacher / Admin</text><text x="58" y="265" class="small">Login, records and admin actions</text><text x="58" y="288" class="small">Cookie or Bearer credentials</text><rect x="580" y="200" width="310" height="140" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="598" y="230" class="label">Flask application</text><text x="598" y="257" class="small">Routes, identity and authorization</text><text x="598" y="280" class="small">SQL queries and HTML / JSON / CSV</text><rect x="1170" y="200" width="285" height="140" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="1188" y="230" class="label">PostgreSQL</text><text x="1188" y="257" class="small">Users, classes, enrollments, notes</text><text x="1188" y="280" class="small">Database credentials and storage</text><path d="M440 150 V420" class="boundary"/><text x="392" y="141" class="label">TB1</text><path d="M1050 150 V420" class="boundary"/><text x="1024" y="141" class="label">TB2</text><polyline points="310,240 580,240" class="edge"/><text x="323" y="225" class="small">F01 / 05 / 07 / 09 / 13 / 17 / 21</text><text x="323" y="263" class="small">25 / 29 / 33 / 37 / 41 / 45 / 49</text><polyline points="580,304 310,304" class="edge"/><text x="325" y="326" class="small">Corresponding browser responses</text><polyline points="890,240 1170,240" class="edge"/><text x="908" y="218" class="small">Queries F02 / 10 / 14 / 18 / 22</text><text x="908" y="263" class="small">26 / 30 / 34 / 46</text><polyline points="1170,302 890,302" class="edge"/><text x="930" y="325" class="small">Query results / status</text><rect x="580" y="430" width="310" height="112" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="598" y="460" class="label">Shell and ping process</text><text x="598" y="487" class="small">F38 command; F39 output/error</text><text x="598" y="510" class="small">Same OS user as Flask</text><polyline points="680,340 680,430" class="edge"/><text x="550" y="378" class="small">F38</text><polyline points="795,430 795,340" class="edge"/><text x="805" y="378" class="small">F39</text><path d="M560 400 H915" class="boundary"/><text x="900" y="391" class="label">TB3</text><rect x="580" y="610" width="310" height="110" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="598" y="640" class="label">Container files and config</text><text x="598" y="667" class="small">Static files F42–F43; logs F51–F52</text><text x="598" y="690" class="small">Config F59–F60; baked backup</text><polyline points="580,320 550,320 550,665 580,665" class="edge" marker-start="url(#a)"/><text x="562" y="587" class="small">Internal file access</text><rect x="1170" y="610" width="285" height="140" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="1188" y="640" class="label">Docker Engine host</text><text x="1188" y="667" class="small">Docker socket F53–F54</text><text x="1188" y="690" class="small">Host project bind mount F55–F56</text><text x="1188" y="713" class="small">Conditional after code execution</text><polyline points="890,490 1000,490 1000,660 1170,660" class="edge" marker-start="url(#a)"/><text x="1010" y="580" class="small">Potential control</text><text x="1010" y="600" class="small">and file access</text><path d="M1050 555 V790" class="boundary"/><text x="1024" y="548" class="label">TB4</text><rect x="1170" y="430" width="285" height="90" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="1188" y="460" class="label">External database client</text><text x="1188" y="487" class="small">Published TCP port 5432</text><polyline points="1300,430 1300,340" class="edge" marker-start="url(#a)"/><text x="1320" y="380" class="small">F57 / F58</text><path d="M1170 395 H1455" class="boundary"/><text x="1180" y="386" class="label">TB5</text><rect x="40" y="470" width="270" height="140" rx="10" fill="#edf6fa" stroke="#24779a"/><text x="58" y="500" class="label">Teacher spreadsheet</text><text x="58" y="527" class="small">CSV downloaded through F28</text><text x="58" y="550" class="small">Untrusted cells may be interpreted</text><text x="58" y="573" class="small">Client-side formula risk TH15</text><polyline points="160,350 160,470" class="edge"/><text x="180" y="395" class="small">Open downloaded CSV</text><path d="M40 430 H310" class="boundary"/><text x="50" y="419" class="label">TB6</text><text x="40" y="825" class="label">Boundary interpretation</text><text x="40" y="859" class="body">TB1 browser ↔ application; TB2 application ↔ database; TB3 data ↔ shell interpretation.</text><text x="40" y="890" class="body">TB4 container ↔ Engine host resources; TB5 external client ↔ database; TB6 CSV data ↔ spreadsheet interpretation.</text><text x="40" y="921" class="body">TB3 is not a change of OS user. Root in a container alone does not prove host compromise.</text><text x="40" y="952" class="body">F53–F58 describe configuration-exposed capabilities, not observed ordinary application requests.</text><text x="40" y="983" class="body">On Docker Desktop the Engine host is a VM; consequences for macOS depend on its mounts and permissions.</text><text x="40" y="1014" class="body">Return flows and redirect details are expanded in the canonical register. Static files are not stored in PostgreSQL.</text><text x="40" y="1060" class="label">Ping network detail — expands the shell/ping process above</text>
<rect x="40" y="1100" width="400" height="105" rx="10" fill="#edf6fa" stroke="#24779a"/>
<text x="58" y="1130" class="label">Same shell / ping process (F38–F39)</text>
<text x="58" y="1157" class="small">Admin-selected destination; fixed one-packet ping</text>
<text x="58" y="1184" class="small">No external probe is claimed as observed evidence</text>
<rect x="1030" y="1100" width="425" height="105" rx="10" fill="#edf6fa" stroke="#24779a"/>
<text x="1048" y="1130" class="label">Network destination / hostname resolver</text>
<text x="1048" y="1157" class="small">ICMP target; resolver used only for hostname lookup</text>
<text x="1048" y="1184" class="small">Replies, network errors, or no reply before timeout</text>
<path d="M740 1090 V1220" class="boundary"/>
<text x="720" y="1080" class="label">TB7</text>
<polyline points="440,1130 1030,1130" class="edge"/>
<text x="470" y="1115" class="small">F61: echo request / conditional name query</text>
<polyline points="1030,1180 440,1180" class="edge"/>
<text x="470" y="1202" class="small">F62: echo reply / name answer / network error</text>
<text x="40" y="1260" class="body">TB7 is crossed for nonlocal destinations; a loopback ping stays local. Egress policy limits this capability.</text>
<text x="40" y="1290" class="body">Role and record permissions are logical checks at TB1; the browser box does not imply equal privileges.</text>
</svg>