limit_req_zone $binary_remote_addr zone=notesapp_requests:10m rate=10r/s;
server {
    listen 80;
    server_name localhost;
    # Fixed authority prevents an attacker-controlled Host redirect.
    return 308 https://localhost:${NOTESAPP_HTTPS_PORT}$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/notesapp.crt;
    ssl_certificate_key /etc/nginx/certs/notesapp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    location / {
        limit_req zone=notesapp_requests burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://web:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
