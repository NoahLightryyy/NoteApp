# Explicit loopback-only HTTP mode for the Class 5 before/after capture.
# Return to the default compose file afterwards; this intentionally bypasses TLS.
services:
  web:
    ports:
      - "127.0.0.1:${NOTESAPP_HTTP_LAB_PORT:-8080}:5000"
    environment:
      SESSION_COOKIE_SECURE: "false"
    networks: [backend, frontend]
