name: notesapp-session03
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_lab_only
    volumes:
      - encrypted_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_lab_only
      CSV_HMAC_KEY_FILE: /run/secrets/csv_hmac_key
      COMMENT_KEY_FILE: /run/secrets/comment_key
    secrets:
      - comment_key
      - csv_hmac_key
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python migrate_comments.py && python app.py"]
  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/certs:ro
secrets:
  csv_hmac_key:
    file: ./secrets/csv_hmac.key
  comment_key:
    file: ./secrets/comment.key
volumes:
  encrypted_pgdata:
